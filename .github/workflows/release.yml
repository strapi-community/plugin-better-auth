name: Release

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # Builds the plugins and calls changeset publish
          publish-script: pnpm release:publish
          version-script: pnpm release:prepare

      # PRs created with GITHUB_TOKEN don't trigger the Tests workflow, so dispatch it manually
      - name: Run tests on the Version Packages PR
        if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run tests.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy docs
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
